sonar.projectKey=invoice
sonar.projectName=Invoice and Receipt Generator
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=backend/tests/**,frontend/tests/**,**/node_modules/**,**/coverage/**,backend/data/**,**/dist/**,**/build/**
# Tool configuration files are not application code and have no unit tests.
sonar.coverage.exclusions=frontend/*.config.js
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
