name: Backend core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/backend-invoices]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Initialize the CI database
        run: |
          cp .env.example .env
          npm run db:init
      - run: npm run check
      - run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-lcov
          path: backend/coverage/lcov.info
          if-no-files-found: error

  sonarqube:
    name: SonarQube quality gate
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SONAR_HOST_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: backend-lcov
          path: backend/coverage
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
