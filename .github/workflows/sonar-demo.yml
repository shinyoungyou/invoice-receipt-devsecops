# DEMO ONLY. Lives only on the demo/sonar-gate branch, which is never merged.
# Scans each push into SonarQube Cloud so the presentation can show the
# quality gate failing (and passing again) inside GitHub Actions.
name: SonarQube Cloud demo

on:
  push:
    branches: [demo/sonar-gate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar-cloud:
    name: SonarQube Cloud quality gate (demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend coverage
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          cp .env.example .env
          npm run db:init
          npm run test:coverage
      - name: Frontend coverage
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run test:coverage
      - name: Scan and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_CLOUD_TOKEN }}
        with:
          # Reuses the team's sonar-project.properties; only the target changes.
          # projectVersion = commit SHA, so the "Previous version" new-code
          # setting judges each push on its own changes.
          args: >
            -Dsonar.organization=shinyoungyou
            -Dsonar.projectKey=shinyoungyou_invoice-receipt-devsecops
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.qualitygate.wait=true
